name: Apply incus-gpu v0.1.4

on:
  push:
    paths:
      - .github/workflows/apply-v0.1.4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply changes
        run: python3 .github/scripts/apply-v0.1.4.py

      - name: Test
        run: |
          git diff --check
          bash -n incus-gpu install.sh uninstall.sh tests/test.sh
          ./tests/test.sh

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md incus-gpu tests/test.sh
          git commit -m "Improve VFIO probe diagnostics and recovery"
          git push
