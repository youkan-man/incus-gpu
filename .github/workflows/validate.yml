name: Validate incus-gpu
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax and regression tests
        run: |
          make test-all
      - name: Package tested sources
        if: always()
        run: git archive --format=tar HEAD > incus-gpu-source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tested-source
          path: incus-gpu-source.tar
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-mock-evidence
          path: gpu-mock-results/
          retention-days: 7
