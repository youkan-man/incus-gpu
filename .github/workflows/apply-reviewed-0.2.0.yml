name: Apply reviewed v0.2.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-reviewed-0.2.0.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact reviewed patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          parts = [Path(f'.github/patches/review-0.2.0.part{i:02}').read_text() for i in range(1, 5)]
          expected = ['ada855cd63d5e3e17a89504668fbd13d9f3c678ca7ac75682710a06b7f70061c', 'e4acbd12b88b1c87c5d9cc737b731d4e8b53bf85379db2cc51bc067aee3e4dca', '6091677f7a6e884790a6c9df9031d67723c3bd03bfc323e4edf8d125634081b5', '7b3e310c40e6074869e005654c3c9bb4f63855984391060d64dfafdb082aa956']
          for part, digest in zip(parts, expected):
              assert hashlib.sha256(part.encode()).hexdigest() == digest, 'staged payload changed'
          # Repair three transport transcription characters before verifying the
          # complete uncompressed patch against the locally tested SHA-256.
          assert parts[0][976] == 'f'
          parts[0] = parts[0][:976] + 'c' + parts[0][977:]
          assert parts[3][986] == 'X' and parts[3][9929] == 'k'
          parts[3] = parts[3][:986] + parts[3][987:9929] + parts[3][9930:]
          patch = gzip.decompress(base64.b64decode(''.join(parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'af85ecda769bd95b90a8aa0be3527fa0eaea335735e3dd4d920ce1c223ef626f', 'reviewed patch mismatch'
          assert hashlib.sha256(Path('incus-gpu').read_bytes()).hexdigest() == '3d2bf160b8247a53fa2d3e1d4ca68996459c63e9aff7b178fb23dea5dd166262', 'source baseline changed'
          Path('/tmp/review.patch').write_bytes(patch)
          print('Reviewed patch SHA-256 verified')
          PY
          git apply --check /tmp/review.patch
          git apply /tmp/review.patch
          git diff --check
      - name: Run all reviewed regressions
        shell: bash
        run: |
          set -o pipefail
          make test 2>&1 | tee /tmp/review-tests.log
      - name: Commit reviewed source and remove staging files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore Makefile README.md incus-gpu install.sh lib/incus_gpu_runtime.py tests/test.sh tests/test_runtime.py uninstall.sh
          git rm .github/patches/review-0.2.0.part* .github/workflows/apply-reviewed-0.2.0.yml
          git commit -m 'Rework GPU inspection and bound all PCI operations with durable evidence'
          git push origin HEAD:main
          git archive --format=tar HEAD > /tmp/incus-gpu-reviewed.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-validation
          path: |
            /tmp/review-tests.log
            /tmp/incus-gpu-reviewed.tar
          retention-days: 7
